<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0c1a14">
    <title>Berlin Okey</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/okey-table.css">
    <link rel="stylesheet" href="css/atmosphere.css">
    <link rel="stylesheet" href="css/okey-plus.css">
</head>

<body class="phone-layout lobby-page">
    <script>
        document.documentElement.classList.add('phone-layout');
        (function () {
            var w = window.innerWidth, h = window.innerHeight;
            if (w > h) {
                document.documentElement.classList.add('landscape-phone');
                document.addEventListener('DOMContentLoaded', function () {
                    document.body.classList.add('landscape-phone', 'phone-layout');
                });
            }
        })();
    </script>

    <div class="menu-atmosphere" aria-hidden="true"></div>

    <div class="container phone-lobby">
        <header class="header lobby-hero">
            <p class="brand-mark">Online 101</p>
            <h1 class="logo"><span class="logo-text">Berlin Okey</span></h1>
            <p class="tagline">Altı haneli kodla masaya otur</p>
        </header>

        <section id="nameSection" class="card lobby-panel">
            <div class="profile-preview" id="profilePreview">
                <div class="profile-preview-avatar" id="profilePreviewAvatar">
                    <img id="profilePreviewImg" class="profile-photo hidden" alt="">
                    <span id="profilePreviewInitial" class="profile-initial">B</span>
                </div>
                <div class="profile-preview-meta">
                    <span class="profile-preview-label">Profil</span>
                    <span class="profile-preview-name" id="profilePreviewName">Oyuncu</span>
                </div>
            </div>

            <div class="name-input-container hidden" id="nameInputContainer">
                <input type="text" id="playerNameInput" class="name-input" placeholder="İsmini yaz..." maxlength="15"
                    autocomplete="off">
            </div>

            <div class="istaka-selection">
                <p class="section-label">Istaka</p>
                <div class="istaka-grid istaka-swatches">
                    <button type="button" class="istaka-option istaka-swatch selected" data-istaka="istaka.jpg">
                        <span class="istaka-swatch-tone wood"></span>
                        <span class="istaka-label">Klasik</span>
                    </button>
                    <button type="button" class="istaka-option istaka-swatch" data-istaka="istaka_pembe.jpg">
                        <span class="istaka-swatch-tone rosewood"></span>
                        <span class="istaka-label">Pembe</span>
                    </button>
                </div>
            </div>

            <div class="rules-row">
                <label class="rule-chip">
                    <input type="checkbox" id="teamModeToggle">
                    <span>Takım</span>
                </label>
                <label class="rule-chip">
                    <input type="checkbox" id="stackingModeToggle">
                    <span>Katlamalı</span>
                </label>
                <label class="rule-chip">
                    <input type="checkbox" id="penaltyModeToggle">
                    <span>Cezalı</span>
                </label>
            </div>

            <div class="room-actions">
                <button id="quickMatchBtn" class="btn btn-primary btn-large">Hızlı Oyna</button>
                <p class="capacity-line" id="capacityLine">Çevrimiçi: —/100</p>
                <button id="createRoomBtn" class="btn btn-secondary btn-large">Özel Oda Oluştur</button>
                <div class="room-join-row">
                    <input type="text" id="roomCodeInput" class="name-input room-code-input"
                        placeholder="6 haneli kod" maxlength="6" inputmode="numeric" pattern="[0-9]*"
                        autocomplete="off">
                    <button id="joinRoomBtn" class="btn btn-secondary btn-large">Koda Katıl</button>
                </div>
            </div>
        </section>

        <div id="errorToast" class="toast hidden">
            <span class="toast-icon">!</span>
            <span class="toast-message"></span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/telegram.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
